name: Publicar Chronetec no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v6
      - name: Configurar Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Instalar dependências
        run: npm ci
      # Contorna a omissão de dependências opcionais de outra plataforma no package-lock do npm.
      - name: Instalar binding de build para Linux
        run: npm install --no-save @rolldown/binding-linux-x64-gnu@1.0.0
      - name: Gerar versão de produção
        run: npm run build
      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5
      - name: Enviar arquivos compilados
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
